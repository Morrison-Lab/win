name: Check Non-Standard Characters

# Thin caller for the shared reusable workflow in Morrison-Lab/gha.
# Detects non-ASCII punctuation (curly quotes, en/em dashes, the
# multiplication sign) in the reusable workflow's default extension set,
# currently .qmd, .R and .md. The `extensions` input is deliberately left
# unset so the scope tracks gha's default; the lab convention bans these
# glyphs in every tracked source file, Markdown included.
# See https://github.com/Morrison-Lab/gha for inputs and versioning.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # The job id (check-chars) matches the peer course repos, so the
  # status-check context name is the same across them. The reusable workflow
  # only needs contents:read.
  check-chars:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-non-standard-chars.yml@v2
