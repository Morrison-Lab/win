# Fails when a Quarto crossref id (#def-..., #fig-..., ...) is defined in
# more than one place; ids must be unique across the whole book
# (see Morrison-Lab/win#79).
name: Check for duplicate crossref ids

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check-duplicate-crossref-ids.py
