# Caller stub for Morrison-Lab/gha's reusable Quarto-publish workflow
# (replaces the bespoke publish.yml; see ucdavis/win#74).
#
# Renders the Quarto site and deploys it to the gh-pages branch (which GitHub
# Pages serves). The calling job must grant contents: write so the deploy step
# can push to gh-pages (repos default to a read-only token).
name: Quarto Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize this workflow's own runs. The group must NOT be named `gh-pages`:
# the called workflow's deploy job already holds that group, and a caller-level
# block with the same name deadlocks it (the deploy job fails with no runner,
# no steps and no log, so the site silently stops publishing;
# Morrison-Lab/gha#809). Every publish run on main failed this way from
# 2026-09-29 until this rename.
concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    uses: Morrison-Lab/gha/.github/workflows/quarto-publish.yml@v2
    with:
      setup-r: true
      use-renv: true
      tinytex: true
      checkout-submodules: true
      # System libs the renv.lock packages compile against (curl, openssl,
      # xml2, gert, V8, igraph, ragg, textshaping).
      apt-packages: >-
        libnode-dev libglpk-dev libcurl4-openssl-dev libssl-dev libxml2-dev
        libgit2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev
        libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev
