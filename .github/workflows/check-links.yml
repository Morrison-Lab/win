name: Check Links

# Thin caller for the shared reusable workflow in Morrison-Lab/gha.
# The reusable workflow runs lychee over .qmd/.md/.html, honors a PR
# skip-label ("links checked by hand"), and files an issue when links break
# on main. We pass the repo-local lychee.toml so its excludes (e.g. quarto.org)
# apply.
# See https://github.com/Morrison-Lab/gha for inputs and versioning.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Run weekly on Mondays at 9:00 UTC to catch link rot
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # The job id (link-checker) matches the peer course repos, so the
  # status-check context name is the same across them.
  link-checker:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: Morrison-Lab/gha/.github/workflows/check-links.yml@v2
    with:
      lychee-config: lychee.toml
